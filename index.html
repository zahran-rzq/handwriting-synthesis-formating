<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Lines Formatter (GUI)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Text to Lines Formatter (GUI)</h1>

    <div class="config-panel">
        <div class="config-item">
            <label for="cfgBoxWidth">Box Width (px):</label>
            <input type="number" id="cfgBoxWidth" value="503">
        </div>
        <div class="config-item">
            <label for="cfgNumLines">Lines per Page:</label>
            <input type="number" id="cfgNumLines" value="32">
        </div>
        <div class="config-item">
            <label for="cfgMaxChars">Max Chars / Line:</label>
            <input type="number" id="cfgMaxChars" value="72">
        </div>
        <div class="config-item">
            <label for="downloadFileName">File Name:</label>
            <input type="text" id="downloadFileName" value="hasil_sintesis" placeholder="contoh: dasar_teori">
        </div>
        <button class="btn" onclick="processText()">Generate Preview</button>
    </div>

    <div class="main-container">
        <div class="panel">
            <h2>Input Text</h2>
            <textarea id="inputText" placeholder="Ketik teks Anda di sini...

Format:
- Tekan Enter 1x untuk baris baru (nyambung paragraf).
- Tekan Enter 2x untuk membuat 1 baris kosong (paragraf baru).
- Tekan Enter 3x untuk membuat 2 baris kosong, dan seterusnya." oninput="processText()"></textarea>
        </div>

        <div class="panel">
            <h2>Generated Preview (Normal, Tidak Justify)</h2>
            <textarea id="outputText" class="preview-area" readonly></textarea>
            <div class="pagination-controls">
                <button id="btnPrev" class="btn" onclick="prevPage()" disabled>&laquo; Prev Page</button>
                <span id="pageIndicator">Page 0 of 0</span>
                <button id="btnNext" class="btn" onclick="nextPage()" disabled>Next Page &raquo;</button>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-success" onclick="downloadOriginal()">📥 Download Original Input</button>
        <button class="btn btn-success" onclick="downloadCurrentPage()">📄 Download Current Page</button>
        <button class="btn btn-success" onclick="downloadAllPagesIndividual()">📑 Download All Pages (Individual TXT)</button>
        <button class="btn btn-success" onclick="exportPagesToFolder()">📁 Export Pages to Folder</button>
        <span id="exportFolderStatus">Folder tujuan: belum dipilih</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
