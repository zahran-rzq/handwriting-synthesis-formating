<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Lines Formatter (GUI)</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --border-color: #ccc;
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --success-color: #28a745;
            --success-hover: #218838;
            --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            --mono-font: 'Consolas', 'Courier New', Courier, monospace;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 24px;
        }

        .config-panel {
            background: #fff;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: center;
        }

        .config-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .config-item input {
            width: 80px;
            padding: 5px;
            border: 1px solid var(--border-color);
            border-radius: 3px;
        }

        .main-container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0; 
        }

        .panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 15px;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        textarea {
            flex: 1;
            resize: none;
            padding: 10px;
            font-family: var(--mono-font);
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }
        
        textarea:focus {
            border-color: var(--primary-color);
        }

        .preview-area {
            background-color: #f8f9fa;
        }

        .pagination-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            background-color: var(--primary-color);
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }

        .btn-success {
            background-color: var(--success-color);
        }

        .btn-success:hover {
            background-color: var(--success-hover);
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Text to Lines Formatter (GUI)</h1>

    <div class="config-panel">
        <div class="config-item">
            <label>Box Width (px):</label>
            <input type="number" id="cfgBoxWidth" value="503">
        </div>
        <div class="config-item">
            <label>Lines per Page:</label>
            <input type="number" id="cfgNumLines" value="32">
        </div>
        <div class="config-item">
            <label>Max Chars / Line:</label>
            <input type="number" id="cfgMaxChars" value="72">
        </div>
        <button class="btn" onclick="processText()">Generate Preview</button>
    </div>

    <div class="main-container">
        <!-- Input Area -->
        <div class="panel">
            <h2>Input Text</h2>
            <textarea id="inputText" placeholder="Ketik teks Anda di sini...

Format:
- Tekan Enter 1x untuk baris baru (nyambung paragraf).
- Tekan Enter 2x untuk membuat 1 baris kosong (paragraf baru).
- Tekan Enter 3x untuk membuat 2 baris kosong, dan seterusnya." oninput="processText()"></textarea>
        </div>

        <!-- Preview Area -->
        <div class="panel">
            <h2>Generated Preview (Normal, Tidak Justify)</h2>
            <textarea id="outputText" class="preview-area" readonly></textarea>
            
            <div class="pagination-controls">
                <button id="btnPrev" class="btn" onclick="prevPage()" disabled>&laquo; Prev Page</button>
                <span id="pageIndicator">Page 0 of 0</span>
                <button id="btnNext" class="btn" onclick="nextPage()" disabled>Next Page &raquo;</button>
            </div>
        </div>
    </div>

    <div class="actions">
        <button class="btn btn-success" onclick="downloadOriginal()">📥 Download Original Input</button>
        <button class="btn btn-success" onclick="downloadCurrentPage()">📄 Download Current Page</button>
        <button class="btn btn-success" onclick="downloadAllPagesIndividual()">📑 Download All Pages (Individual TXT)</button>
    </div>

    <script>
        // --- Configurations dari file Python ---
        const charWidths = {
            'a': 0.6, 'b': 0.6, 'c': 0.6, 'd': 0.6, 'e': 0.6, 'f': 0.4, 'g': 0.6, 'h': 0.6, 'i': 0.3, 'j': 0.3, 'k': 0.6, 'l': 0.3, 'm': 0.9, 'n': 0.6, 'o': 0.6, 'p': 0.6, 'q': 0.6, 'r': 0.4, 's': 0.6, 't': 0.4, 'u': 0.6, 'v': 0.6, 'w': 0.9, 'x': 0.6, 'y': 0.6, 'z': 0.6,
            'A': 0.7, 'B': 0.7, 'C': 0.7, 'D': 0.7, 'E': 0.7, 'F': 0.7, 'G': 0.7, 'H': 0.7, 'I': 0.4, 'J': 0.4, 'K': 0.7, 'L': 0.7, 'M': 0.9, 'N': 0.7, 'O': 0.7, 'P': 0.7, 'Q': 0.7, 'R': 0.7, 'S': 0.7, 'T': 0.7, 'U': 0.7, 'V': 0.7, 'W': 0.9, 'X': 0.7, 'Y': 0.7, 'Z': 0.7,
            ' ': 0.3, '.': 0.3, ',': 0.3, '!': 0.3, '?': 0.3, '-': 0.3, '_': 0.3, ':': 0.3, ';': 0.3, '(': 0.3, ')': 0.3, '[': 0.3, ']': 0.3, '{': 0.3, '}': 0.3, '/': 0.3, '\\': 0.3, '|': 0.3, '@': 0.9, '#': 0.9, '$': 0.9, '%': 0.9, '^': 0.9, '&': 0.9, '*': 0.9, '+': 0.9, '=': 0.9,
            '0': 0.6, '1': 0.6, '2': 0.6, '3': 0.6, '4': 0.6, '5': 0.6, '6': 0.6, '7': 0.6, '8': 0.6, '9': 0.6,
            'q': 0.6, 'Q': 0.7, 'S': 0.7, 'X': 0.7, 'Z': 0.7, '\x00': 0.3
        };
        
        const validCharSet = new Set(['9', 'l', 'd', 'D', 'J', 'c', '6', 'V', '\x00', '-', '"', 'H', 't', 'r', '(', 'N', 'u', 'y', 'I', ';', '!', 'F', 'j', ')', '#', 'B', 'O', '4', 'M', 'W', 'f', '?', '8', 'g', ',', '1', 'w', "'", 'A', 'm', 'K', 'C', 'o', ' ', ':', 'n', 'U', 'h', 's', 'q', '5', 'x', 'k', 'S', '0', 'Y', 'p', 'e', 'P', 'a', 'R', 'b', '2', '3', 'v', 'E', 'i', 'G', 'T', '7', '.', 'z', 'L']);
        
        const FONT_WIDTH = 14.4; // 18 * 0.8
        
        // --- State Variables ---
        let pages = [];
        let currentPageIdx = 0;

        // --- Helper Functions persis python script ---
        function approximateWordLength(word) {
            let total = 0;
            if (!word) return 0;
            for (let i = 0; i < word.length; i++) {
                let char = word[i];
                let widthMult = charWidths[char] !== undefined ? charWidths[char] : 1.0;
                total += widthMult * FONT_WIDTH;
            }
            return total;
        }

        function replaceInvalidChars(word) {
            let newWord = "";
            for (let i = 0; i < word.length; i++) {
                let char = word[i];
                if (!validCharSet.has(char)) {
                    if (validCharSet.has(char.toLowerCase())) {
                        newWord += char.toLowerCase();
                    } else if (validCharSet.has(char.toUpperCase())) {
                        newWord += char.toUpperCase();
                    }
                } else {
                    newWord += char;
                }
            }
            return newWord;
        }

        // --- Proses Logic ---
        function processText() {
            const rawText = document.getElementById("inputText").value;
            const boxWidth = parseInt(document.getElementById("cfgBoxWidth").value) || 503;
            const numLines = parseInt(document.getElementById("cfgNumLines").value) || 32;
            const maxCharPerLine = parseInt(document.getElementById("cfgMaxChars").value) || 72;

            let allLines = [];
            
            // Baca Natural Enter dari Textarea
            const rawParagraphs = rawText.split('\n');

            for (let pIdx = 0; pIdx < rawParagraphs.length; pIdx++) {
                let paragraph = rawParagraphs[pIdx].trimEnd(); // Hapus spasi kosong di ujung agar perhitungan presisi
                
                // Jika baris benar-benar kosong (efek user tekan Enter beruntun)
                if (paragraph === "") {
                    allLines.push("");
                    continue;
                }

                // Process words in current paragraph (split by whitespace)
                let words = paragraph.split(/\s+/).filter(w => w.length > 0);
                let currentLine = "";

                for (let i = 0; i < words.length; i++) {
                    let validWord = replaceInvalidChars(words[i]);
                    if (!validWord) continue;

                    let wordLength = approximateWordLength(validWord);
                    let currentLineLength = approximateWordLength(currentLine);

                    // Pengecekan limit (Rumus ini 100% meniru Python: tidak menambah panjang spasi saat mengukur proposed pixel, 
                    // namun tetap menghitung ekstra 1 karakter spasi untuk limit karakter).
                    if (currentLineLength + wordLength <= boxWidth && currentLine.length + validWord.length + 1 <= maxCharPerLine) {
                        if (currentLine) {
                            currentLine += " " + validWord;
                        } else {
                            currentLine = validWord;
                        }
                    } else {
                        // Current line is full, start new line
                        if (currentLine) {
                            allLines.push(currentLine);
                        }
                        currentLine = validWord;
                    }
                }

                // Masukkan baris terakhir dari paragraf tersebut
                if (currentLine) {
                    allLines.push(currentLine);
                }
            }

            // Pisahkan menjadi pages / paginasi berdasarkan numLines
            pages = [];
            for (let i = 0; i < allLines.length; i += numLines) {
                pages.push(allLines.slice(i, i + numLines));
            }

            currentPageIdx = 0;
            updatePreview();
        }

        // --- Navigasi UI ---
        function updatePreview() {
            const btnPrev = document.getElementById("btnPrev");
            const btnNext = document.getElementById("btnNext");
            const pageIndicator = document.getElementById("pageIndicator");
            const outputText = document.getElementById("outputText");

            if (pages.length === 0) {
                outputText.value = "";
                pageIndicator.textContent = "Page 0 of 0";
                btnPrev.disabled = true;
                btnNext.disabled = true;
                return;
            }

            pageIndicator.textContent = `Page ${currentPageIdx + 1} of ${pages.length}`;
            outputText.value = pages[currentPageIdx].join('\n');

            btnPrev.disabled = (currentPageIdx === 0);
            btnNext.disabled = (currentPageIdx === pages.length - 1);
        }

        function prevPage() {
            if (currentPageIdx > 0) {
                currentPageIdx--;
                updatePreview();
            }
        }

        function nextPage() {
            if (currentPageIdx < pages.length - 1) {
                currentPageIdx++;
                updatePreview();
            }
        }

        // --- Download ---
        function downloadFile(filename, text) {
            if (!text) return;
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function downloadOriginal() {
            const text = document.getElementById("inputText").value;
            if (!text) { alert("Teks input kosong!"); return; }
            downloadFile("input_asli.txt", text);
        }

        function downloadCurrentPage() {
            if (pages.length === 0) { alert("Tidak ada teks yang di-generate!"); return; }
            const text = pages[currentPageIdx].join('\n');
            downloadFile(`halaman_${currentPageIdx + 1}.txt`, text);
        }

        // Mengunduh banyak file sekaligus (Individual files)
        function downloadAllPagesIndividual() {
            if (pages.length === 0) {
                alert("Tidak ada halaman untuk diunduh!");
                return;
            }
            
            // Konfirmasi ke user karena browser biasanya meminta izin untuk "Multiple Downloads"
            if (!confirm(`Terdapat ${pages.length} halaman. Browser Anda mungkin meminta izin untuk mengunduh banyak file. Lanjutkan?`)) {
                return;
            }

            // Menggunakan jeda waktu kecil (delay 300ms antar file) agar browser tidak memblokir antrean unduhan
            pages.forEach((pageLines, index) => {
                setTimeout(() => {
                    const text = pageLines.join('\n');
                    downloadFile(`halaman_${index + 1}.txt`, text);
                }, index * 300);
            });
        }
    </script>
</body>
</html>
